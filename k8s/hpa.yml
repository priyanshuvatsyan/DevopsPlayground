---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devops-client-hpa
  namespace: devopsplayground
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devops-client
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devops-server-hpa
  namespace: devopsplayground
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devops-server
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50