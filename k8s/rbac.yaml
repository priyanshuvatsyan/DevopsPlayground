# 1. YOUR UPDATED ROLE (Added NetworkPolicies for Chaos Engineering)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devops-playground-role
  namespace: devopsplayground
rules:
- apiGroups: [""]
  resources: ["pods", "services", "pods/log"]
  verbs: ["get", "list", "watch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets"] 
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "create", "delete", "patch"]
---
# 2. YOUR EXISTING ROLE BINDING (Unchanged)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devops-playground-rolebinding
  namespace: devopsplayground
subjects:
- kind: ServiceAccount
  name: default
  namespace: devopsplayground
roleRef:
  kind: Role
  name: devops-playground-role
  apiGroup: rbac.authorization.k8s.io
---
# 3. CLUSTER ROLE (Required to read Argo CD apps, plus Cluster Nodes & Namespaces)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devops-cluster-reader
rules:
- apiGroups: ["argoproj.io"]
  resources: ["applications"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["nodes", "namespaces"]
  verbs: ["get", "list"]
---
# 4. CLUSTER ROLE BINDING
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devops-cluster-reader-binding
subjects:
- kind: ServiceAccount
  name: default
  namespace: devopsplayground
roleRef:
  kind: ClusterRole
  name: devops-cluster-reader
  apiGroup: rbac.authorization.k8s.io