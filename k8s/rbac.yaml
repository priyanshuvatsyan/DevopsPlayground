---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devops-playground-role
  namespace: devopsplayground
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list", "watch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devops-playground-rolebinding
  namespace: devopsplayground
subjects:
- kind: ServiceAccount
  name: default
  namespace: devopsplayground
roleRef:
  kind: Role
  name: devops-playground-role
  apiGroup: rbac.authorization.k8s.io