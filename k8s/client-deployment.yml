---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-client
  labels:
    app: devops-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-client
  template:
    metadata:
      labels:
        app: devops-client
    spec:
      containers:
      - name: client
        image: priyanshuvatsyan/devops-client:latest
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: devops-client-svc
spec:
  selector:
    app: devops-client
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP