name: Build, Push, and Update GitOps Manifests

on:
  push:
    branches:
      - master
    paths:
      - 'client/**'
      - 'server/**'
      - '.github/workflows/**'
      # Explicitly ignoring the k8s folder prevents infinite build loops
      - '!k8s/**'

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  # Define two separate image repositories
  CLIENT_IMAGE: priyanshuvatsyan/devops-client
  SERVER_IMAGE: priyanshuvatsyan/devops-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set_tag.outputs.tag }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Image Tag
        id: set_tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      # --- BUILD AND PUSH CLIENT ---
      - name: Build and Push Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./client   # Points to the client folder
          push: true
          tags: |
            ${{ env.CLIENT_IMAGE }}:${{ steps.set_tag.outputs.tag }}
            ${{ env.CLIENT_IMAGE }}:latest

      # --- BUILD AND PUSH SERVER ---
      - name: Build and Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./server   # Points to the server folder
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:${{ steps.set_tag.outputs.tag }}
            ${{ env.SERVER_IMAGE }}:latest

  update-manifests:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # A Personal Access Token (PAT) is required here so the subsequent commit 
          # can trigger Argo CD webhooks if configured, and bypass default GITHUB_TOKEN protections.
          token: ${{ secrets.GITOPS_PAT }}

      - name: Update Kubernetes Deployment YAML
        env:
          NEW_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          # Uses sed to find the image line and replace the tag
          # This assumes your image line looks like: image: yourdockerhub/devops-playground:oldtag
          sed -i "s|image: ${{ env.CLIENT_IMAGE }}:.*|image: ${{ env.CLIENT_IMAGE }}:${NEW_TAG}|g" k8s/deployment.yaml
          sed -i "s|image: ${{ env.SERVER_IMAGE }}:.*|image: ${{ env.SERVER_IMAGE }}:${NEW_TAG}|g" k8s/deployment.yaml

      - name: Commit and Push Changes
        env:
          NEW_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add k8s/deployment.yaml
          # Only commit if there are actual changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(gitops): update image tag to ${NEW_TAG}" && git push)